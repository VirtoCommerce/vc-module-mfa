<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Multi-Factor Authentication">
  <title>Multi-Factor Authentication</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="92%" y2="100%">
      <stop offset="0%" stop-color="#6E7E97"/>
      <stop offset="100%" stop-color="#3E4C63"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#10161F" flood-opacity="0.30"/>
    </filter>
    <g id="ast">
      <line x1="0" y1="-6" x2="0" y2="6"/>
      <line x1="-5.2" y1="-3" x2="5.2" y2="3"/>
      <line x1="-5.2" y1="3" x2="5.2" y2="-3"/>
    </g>
    <!-- OTP padlock with a one-time passcode (same as the OTP module icon) -->
    <g id="lock">
      <path d="M-20,-6 V-20 A20,20 0 0 1 20,-20 V-6" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
      <rect x="-38" y="-10" width="76" height="52" rx="12" fill="#FFC24D"/>
      <g stroke="#3E4C63" stroke-width="4" stroke-linecap="round">
        <use href="#ast" x="-25.5" y="16"/>
        <use href="#ast" x="-8.5" y="16"/>
        <use href="#ast" x="8.5" y="16"/>
        <use href="#ast" x="25.5" y="16"/>
      </g>
    </g>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- Glyph: OTP padlock + email badge (code delivered by email) -->
  <g transform="translate(64,64)" filter="url(#lift)">
    <use href="#lock" transform="translate(-6,-6) scale(0.9)"/>
    <rect x="8" y="16" width="38" height="28" rx="6" fill="#5FC8F5" stroke="#FFFFFF" stroke-width="3.5"/>
    <path d="M14,23 L27,32 L40,23" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
