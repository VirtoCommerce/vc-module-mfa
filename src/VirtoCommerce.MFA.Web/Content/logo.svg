<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Multi-Factor Authentication">
  <title>Multi-Factor Authentication</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="92%" y2="100%">
      <stop offset="0%" stop-color="#6E7E97"/>
      <stop offset="100%" stop-color="#3E4C63"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#10161F" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- Glyph: password (1st factor) + emailed code (2nd factor) + verified check -->
  <g transform="translate(64,64)" filter="url(#lift)">
    <!-- Password field -->
    <rect x="-42" y="-42" width="72" height="28" rx="8" fill="#FFFFFF"/>
    <g fill="#3E4C63">
      <circle cx="-30" cy="-28" r="4"/>
      <circle cx="-18" cy="-28" r="4"/>
      <circle cx="-6" cy="-28" r="4"/>
      <circle cx="6" cy="-28" r="4"/>
    </g>

    <!-- Email with the one-time code -->
    <rect x="-20" y="-6" width="62" height="44" rx="8" fill="#5FC8F5"/>
    <path d="M-13,2 L11,19 L35,2" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Verified badge -->
    <circle cx="-28" cy="26" r="15" fill="#2FA85A" stroke="#FFFFFF" stroke-width="3.5"/>
    <path d="M-35,26 L-30,31 L-21,21" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
